; Voyager rendering tiers. Simulation, terrain collision and obstacle IDs are unchanged.
; Keep per-pixel spherical aerial perspective on all tiers; far LUT shortcuts
; produce visible discontinuities across this project's surface-to-orbit range.
[ViewDistanceQuality@0]
r.ViewDistanceScale=1.0
[ViewDistanceQuality@1]
r.ViewDistanceScale=1.5
[ViewDistanceQuality@2]
r.ViewDistanceScale=2.0

[TextureQuality@0]
r.Streaming.PoolSize=1024
r.Streaming.LimitPoolSizeToVRAM=1
[TextureQuality@1]
r.Streaming.PoolSize=2048
r.Streaming.LimitPoolSizeToVRAM=1
[TextureQuality@2]
r.Streaming.PoolSize=4096
r.Streaming.LimitPoolSizeToVRAM=1

[EffectsQuality@0]
r.SkyAtmosphere.FastSkyLUT=0
r.SkyAtmosphere.AerialPerspectiveLUT.FastApplyOnOpaque=0
r.SkyAtmosphere.SampleCountMax=32
r.VolumetricCloud.ViewRaySampleMaxCount=96
[EffectsQuality@1]
r.SkyAtmosphere.FastSkyLUT=0
r.SkyAtmosphere.AerialPerspectiveLUT.FastApplyOnOpaque=0
r.SkyAtmosphere.SampleCountMax=64
r.VolumetricCloud.ViewRaySampleMaxCount=192
[EffectsQuality@2]
r.SkyAtmosphere.FastSkyLUT=0
r.SkyAtmosphere.AerialPerspectiveLUT.FastApplyOnOpaque=0
r.SkyAtmosphere.SampleCountMax=96
r.VolumetricCloud.ViewRaySampleMaxCount=384
